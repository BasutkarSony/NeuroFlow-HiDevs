name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt ruff mypy pytest pytest-cov pytest-asyncio
      - run: ruff check backend/
      - run: mypy tests/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt pytest pytest-cov pytest-asyncio
      - run: python -m pytest tests/unit/ -v --cov=backend --cov-report=xml

  database-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: neuroflow
          POSTGRES_PASSWORD: neuroflow_test
          POSTGRES_DB: neuroflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuroflow -d neuroflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://neuroflow:neuroflow_test@localhost:5432/neuroflow_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt pytest pytest-asyncio
      - run: python -m pytest tests/integration/ -v

  container-build:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      JWT_SECRET_KEY: ci-jwt-secret-change-this
      AUTH_CLIENT_SECRET: ci-client-secret
    steps:
      - uses: actions/checkout@v4
      - name: Provide Compose-required local environment
        run: |
          printf 'POSTGRES_PASSWORD=ci-postgres-password\nREDIS_PASSWORD=ci-redis-password\nJWT_SECRET_KEY=ci-jwt-secret-change-this\nAUTH_CLIENT_SECRET=ci-client-secret\n' > .env
      - name: Validate Docker Compose configuration
        run: docker compose -f infra/docker-compose.yml config --quiet
      - name: Build API and worker image
        run: docker build -f backend/Dockerfile -t neuroflow-api:ci .
      - name: Start infrastructure, API, and worker
        run: docker compose -f infra/docker-compose.yml up -d postgres redis mlflow api worker
      - name: Verify health and file ingestion through ARQ worker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            health="$(curl -fsS http://localhost:8000/health || true)"
            if [ -n "$health" ] && HEALTH_JSON="$health" python -c 'import json,os,sys; d=json.loads(os.environ["HEALTH_JSON"]); sys.exit(0 if d.get("status") == "ok" and all(d.get("checks", {}).values()) else 1)'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose -f infra/docker-compose.yml logs
              echo "API did not become healthy in time"
              exit 1
            fi
            sleep 5
          done

          token_response="$(curl -sS -w '\\nHTTP_STATUS:%{http_code}' http://localhost:8000/auth/token \\
            -H 'Content-Type: application/json' \\
            -d '{"client_id":"neuroflow-client","client_secret":"ci-client-secret"}')"
          token_status="${token_response##*HTTP_STATUS:}"
          token_body="${token_response%$'\\n'HTTP_STATUS:*}"
          if [ "$token_status" != "200" ]; then
            echo "Token endpoint returned HTTP $token_status: $token_body"
            docker compose -f infra/docker-compose.yml logs --no-color api postgres redis mlflow
            exit 1
          fi
          token="$(printf '%s' "$token_body" | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"


          printf 'NeuroFlow compose smoke test: durable ingestion worker path.\n' > /tmp/neuroflow-smoke.txt
          response="$(curl -fsS http://localhost:8000/ingest/file \
            -H "Authorization: Bearer $token" \
            -F 'source_type=file' \
            -F 'filename=compose-smoke.txt' \
            -F 'metadata={"source":"ci-compose-smoke"}' \
            -F 'file=@/tmp/neuroflow-smoke.txt;type=text/plain')"
          ingestion_id="$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["ingestion_id"])')"

          for attempt in $(seq 1 30); do
            status="$(curl -fsS "http://localhost:8000/ingest/$ingestion_id" -H "Authorization: Bearer $token")"
            state="$(printf '%s' "$status" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
            if [ "$state" = "complete" ]; then
              printf '%s' "$status" | python -c 'import json,sys; d=json.load(sys.stdin); assert (d.get("chunk_count") or 0) > 0, d; print("Compose ingestion smoke test passed:", d["ingestion_id"], "chunks:", d["chunk_count"])'
              exit 0
            fi
            if [ "$state" = "failed" ]; then
              echo "$status"
              docker compose -f infra/docker-compose.yml logs worker api
              exit 1
            fi
            sleep 5
          done

          docker compose -f infra/docker-compose.yml logs worker api
          echo "Document did not complete ingestion in time"
          exit 1
      - name: Stop Compose stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install detect-secrets pip-audit
      - run: pip-audit -r backend/requirements.txt
      - run: detect-secrets scan --baseline .secrets.baseline
      - run: npm audit --prefix frontend --audit-level=high
