name: Security Scan

on:
  push:
    branches: [main]

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --target runtime -f backend/Dockerfile -t infra-api:latest .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: infra-api:latest
          severity: CRITICAL
          exit-code: 1
