name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt ruff mypy pytest pytest-cov pytest-asyncio
      - run: ruff check backend/
      - run: mypy tests/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt pytest pytest-cov pytest-asyncio
      - run: python -m pytest tests/unit/ -v --cov=backend --cov-report=xml

  database-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: neuroflow
          POSTGRES_PASSWORD: neuroflow_test
          POSTGRES_DB: neuroflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuroflow -d neuroflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://neuroflow:neuroflow_test@localhost:5432/neuroflow_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt pytest pytest-asyncio
      - run: python -m pytest tests/integration/ -v

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provide Compose-required local environment
        run: |
          printf 'POSTGRES_PASSWORD=ci-postgres-password\nREDIS_PASSWORD=ci-redis-password\n' > .env
      - name: Validate Docker Compose configuration
        run: docker compose -f infra/docker-compose.yml config --quiet
      - name: Build API and worker image
        run: docker build -f backend/Dockerfile -t neuroflow-api:ci .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install detect-secrets pip-audit
      - run: pip-audit -r backend/requirements.txt
      - run: detect-secrets scan --baseline .secrets.baseline
      - run: npm audit --prefix frontend --audit-level=high
