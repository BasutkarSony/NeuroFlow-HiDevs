[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "ANN", "ASYNC"]
ignore = ["ANN101", "ANN102", "ANN", "E402", "F405", "F811", "F401", "I", "N", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = false
exclude = "backend/"
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["backend", "."]
